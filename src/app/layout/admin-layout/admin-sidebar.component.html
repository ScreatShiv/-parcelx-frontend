<!-- Mobile backdrop: tap to close -->
<div class="sidebar-backdrop" [class.visible]="mobileOpen()" (click)="closeMobile()"></div>

<!-- Desktop: icon-only, expands on hover. Mobile: hidden until toggled, then full width -->
<nav
  class="sidebar"
  [class.expanded]="isExpanded"
  [class.mobile-open]="mobileOpen()"
  (mouseenter)="isExpanded = true"
  (mouseleave)="isExpanded = false"
>
  <div class="sidebar-logo">
    <i class="pi pi-truck logo-icon"></i>
    <span class="logo-text">Loogistic Admin</span>
  </div>

  <ul class="sidebar-nav">
    @for (item of mainNavItems; track item.label) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="closeMobile()"
          [title]="!isExpanded ? item.label : ''"
        >
          @if (item.icon) {
            <i [class]="item.icon"></i>
          }
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

  <div class="sidebar-separator"></div>

  <ul class="sidebar-nav sidebar-nav-secondary">
    @for (item of secondaryNavItems; track item.label) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="closeMobile()"
          [title]="!isExpanded ? item.label : ''"
        >
          @if (item.icon) {
            <i [class]="item.icon"></i>
          }
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
