<p-dialog
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [blockScroll]="true"
  header="Add Warehouse Address"
  [style]="{ width: '50vw', maxWidth: '600px' }"
>
  <div class="add-warehouse-form-container">
    <form [formGroup]="warehouseForm" (ngSubmit)="onSubmit()" class="add-warehouse-form">
      <div class="form-row">
        <div class="form-field">
          <label for="businessName">Business Name</label>
          <input
            id="businessName"
            type="text"
            pInputText
            formControlName="businessName"
            placeholder="Enter address title..."
          />
          <div *ngIf="warehouseForm.get('businessName')?.touched && warehouseForm.get('businessName')?.invalid" class="error-msg">
            Business Name is required
          </div>
        </div>
        <div class="form-field">
          <label for="senderName">Sender's Name</label>
          <input
            id="senderName"
            type="text"
            pInputText
            formControlName="senderName"
            placeholder="Enter sender/recipient name..."
          />
          <div *ngIf="warehouseForm.get('senderName')?.touched && warehouseForm.get('senderName')?.invalid" class="error-msg">
            Sender's Name is required
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field full-width">
          <label for="fullAddress">Full Address</label>
          <textarea
            id="fullAddress"
            pTextarea
            formControlName="fullAddress"
            rows="3"
            placeholder="Enter full address..."
          ></textarea>
          <div *ngIf="warehouseForm.get('fullAddress')?.touched && warehouseForm.get('fullAddress')?.invalid" class="error-msg">
            Full Address is required
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="phone">Phone</label>
          <input
            id="phone"
            type="text"
            pInputText
            formControlName="phone"
            placeholder="Enter your phone number"
          />
          <div *ngIf="warehouseForm.get('phone')?.touched && warehouseForm.get('phone')?.invalid" class="error-msg">
            <span *ngIf="warehouseForm.get('phone')?.errors?.['required']">Phone is required</span>
            <span *ngIf="warehouseForm.get('phone')?.errors?.['pattern']">Phone must be 10 digits</span>
          </div>
        </div>
        <div class="form-field">
          <label for="pinCode">PIN Code</label>
          <input
            id="pinCode"
            type="text"
            pInputText
            formControlName="pinCode"
            placeholder="Enter your PIN code"
          />
          <div *ngIf="warehouseForm.get('pinCode')?.touched && warehouseForm.get('pinCode')?.invalid" class="error-msg">
            <span *ngIf="warehouseForm.get('pinCode')?.errors?.['required']">PIN Code is required</span>
            <span *ngIf="warehouseForm.get('pinCode')?.errors?.['pattern']">PIN Code must be 6 digits</span>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="city">City</label>
          <input
            id="city"
            type="text"
            pInputText
            formControlName="city"
            placeholder="Enter city..."
          />
          <div *ngIf="warehouseForm.get('city')?.touched && warehouseForm.get('city')?.invalid" class="error-msg">
            City is required
          </div>
        </div>
        <div class="form-field">
          <label for="state">State</label>
          <input
            id="state"
            type="text"
            pInputText
            formControlName="state"
            placeholder="Enter State..."
          />
          <div *ngIf="warehouseForm.get('state')?.touched && warehouseForm.get('state')?.invalid" class="error-msg">
            State is required
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="save-btn" [disabled]="warehouseForm.invalid">Save</button>
        <button type="button" class="reset-btn" (click)="onReset()">Reset</button>
      </div>
    </form>
  </div>
</p-dialog>
